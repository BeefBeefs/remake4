<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="data:,">
  <title>Akuma - Demon Spawn (remake)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #game { width: min(100vw, 133.333vh); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; display: block; }
    #hud { position: fixed; left: 0; top: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #hud .dev { flex-basis: 100%; flex-wrap: wrap; gap: 6px; }
    #hud select, #hud button { background: #1c1410cc; color: #eed; border: 1px solid #6a5a40; border-radius: 4px; padding: 4px 8px; font: inherit; }
    #party { position: fixed; right: 8px; bottom: 6px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
    #party .row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; text-shadow: 0 0 3px #000; }
    #party .bar { width: 90px; height: 7px; background: #200; border: 1px solid #000; }
    #party .bar > i { display: block; height: 100%; background: #c33; }
    #party .bar.mana { width: 50px; height: 4px; }
    #party .bar.mana > i { background: #36c; }
    #act { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 8px; align-items: flex-end; }
    #act button { min-width: 54px; height: 54px; border-radius: 27px; border: 1px solid #fff6; background: #000a; color: #fff; font: inherit; font-size: 18px; padding: 0 10px; touch-action: none; }
    #act button:nth-child(2) { font-size: 12px; height: 44px; border-radius: 22px; }
    #party .lead { color: #ffd; font-weight: 700; }
    #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 24px; text-align: center; padding: 1em; color: #d44; background: #000a; pointer-events: none; }
    #inv { position: fixed; right: 8px; top: 44px; width: min(92vw, 340px); max-height: 60vh; overflow: auto; display: none;
      background: #101830ee; border: 2px solid #8aa0d8; border-radius: 6px; padding: 8px 10px; }
    #quests { position: fixed; right: 8px; top: 44px; width: min(92vw, 340px); max-height: 60vh; overflow: auto; display: none; background: #101830f0; border: 2px solid #8aa0d8; border-radius: 6px; padding: 10px; z-index: 4; }
    #help { position: fixed; inset: 0; margin: auto; width: min(92vw, 420px); height: fit-content; max-height: 80vh; overflow: auto; display: none; background: #101830f5; border: 2px solid #8aa0d8; border-radius: 6px; padding: 12px 14px; z-index: 7; font-size: 14px; line-height: 1.45; }
    #help h3 { margin: 0 0 6px; }
    #help ul { margin: 4px 0 10px; padding-left: 18px; }
    #help button { background: #00000055; color: inherit; border: 1px solid #ffffff44; border-radius: 4px; padding: 4px 12px; font: inherit; }
    #quests .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 6px; }
    #quests .q { padding: 6px 0; border-top: 1px solid #ffffff22; }
    #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 340px); display: none; background: #101830f8; border: 2px solid #8aa0d8; border-radius: 6px; padding: 10px; z-index: 7; }
    #menu .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 6px; }
    #menu .q { padding: 5px 0; border-top: 1px solid #ffffff22; }
    #menu button { width: 100%; text-align: left; background: #00000055; color: inherit; border: 1px solid #ffffff44; border-radius: 4px; padding: 8px 10px; font: inherit; }
    #menu .head button { width: auto; padding: 3px 8px; }
    #menu button:disabled { opacity: .45; }
    #quests .q b { color: #ffd070; }
    #quests .q div { opacity: .85; font-size: 13px; margin-top: 2px; }
    #quests button { background: #00000055; color: inherit; border: 1px solid #ffffff44; border-radius: 4px; padding: 3px 8px; font: inherit; }
    #inv .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 6px; }
    #inv .item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid #ffffff22; }
    #inv small { opacity: .7; }
    #inv button { background: #00000055; color: inherit; border: 1px solid #ffffff44; border-radius: 4px; padding: 3px 8px; font: inherit; }
    #toast { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); background: #000a; padding: 4px 10px; border-radius: 4px; display: none; pointer-events: none; }
    #world { position: fixed; inset: 0; margin: auto; width: min(96vw, 640px); height: fit-content; display: none; background: #101830f0; border: 2px solid #8aa0d8; border-radius: 6px; padding: 8px; }
    #world .bar { display: flex; gap: 6px; margin-bottom: 6px; }
    #world .bar button:last-child { margin-left: auto; }
    #world button { background: #00000066; color: #eed; border: 1px solid #ffffff44; border-radius: 4px; padding: 4px 8px; font: inherit; }
    #world button.on { background: #3a4a80; }
    #world button.here { border-color: #ffd070; color: #ffd070; }
    #world .pic { aspect-ratio: 4 / 3; background-size: cover; position: relative; border-radius: 4px; }
    #world .spot { position: absolute; transform: translate(-50%, -50%); padding: 0 !important; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ffe070 !important; background: #ffe07044 !important; }
    #world .spot.here { border-color: #ff6050 !important; background: #ff605066 !important; }
    #world .spot.cave { border-color: #e070ff !important; background: #e070ff44 !important; }
    #world .spot.sealed { border-color: #888 !important; background: #00000099 !important; opacity: .7; }
    #world .lbl { position: absolute; transform: translate(-50%, 8px); font-size: 10px; line-height: 1; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; white-space: nowrap; }
    #movie { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; z-index: 5; }
    #movie video, #movie img { max-width: 100%; max-height: 100%; }
    #movie .cap { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; color: #fff; font: 18px/1.4 serif; text-shadow: 0 0 6px #000, 0 0 3px #000; padding: 0 1em; white-space: pre-line; }
    #title { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 6; gap: 12px; cursor: pointer; }
    #title img { max-width: 100%; max-height: 80%; image-rendering: pixelated; }
    #title .menu { display: flex; gap: 12px; animation: none; opacity: 1; }
    #title .menu button { background: #000a; color: #eed; border: 2px solid #8aa0d8; border-radius: 6px; padding: 10px 22px; font: inherit; font-size: 18px; }
    #title div { font-size: 16px; letter-spacing: .1em; opacity: .8; animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    #minimap { position: fixed; right: 6px; top: 84px; width: 112px; height: 90px; border: 2px solid #6a5a40; border-radius: 3px; background: #000; opacity: .85; pointer-events: none; image-rendering: pixelated; z-index: 2; }
    #status { position: fixed; left: 8px; bottom: 6px; color: #cbb; text-shadow: 0 0 3px #000; pointer-events: none; }
    #dialogue { position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%); width: min(92vw, 620px); display: none;
      background: #101830ee; border: 2px solid #8aa0d8; border-radius: 6px; padding: 10px 12px; }
    #dialogue.red { background: #301010ee; border-color: #d89090; }
    #dialogue .name { font-weight: 700; margin-bottom: 4px; }
    #dialogue .lines { min-height: 3.9em; white-space: pre-wrap; }
    #dialogue .choices { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    #dialogue button { text-align: left; background: #00000055; color: inherit; border: 1px solid #ffffff44; border-radius: 4px; padding: 5px 8px; font: inherit; }
    #dialogue .hint { opacity: .6; font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game" width="640" height="480"></canvas></div>
  <div id="hud"></div>
  <div id="world"></div>
  <div id="movie"></div>
  <div id="title"></div>
  <div id="inv"></div>
  <div id="quests"></div>
  <div id="menu"></div>
  <div id="help"></div>
  <div id="toast"></div>
  <div id="party"></div>
  <div id="over">Exhausted my body and soul...<br>Now I'm going to have a rest at my place.</div>
  <canvas id="minimap" width="112" height="90"></canvas>
  <div id="status"></div>
  <div id="act"></div>
  <div id="dialogue"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
