<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Akuma - Demon Spawn (remake)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #game { width: min(100vw, 133.333vh); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; display: block; }
    #hud { position: fixed; left: 0; top: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #hud select, #hud button { background: #1c1410cc; color: #eed; border: 1px solid #6a5a40; border-radius: 4px; padding: 4px 8px; font: inherit; }
    #status { position: fixed; left: 8px; bottom: 6px; color: #cbb; text-shadow: 0 0 3px #000; pointer-events: none; }
    #dialogue { position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%); width: min(92vw, 620px); display: none;
      background: #101830ee; border: 2px solid #8aa0d8; border-radius: 6px; padding: 10px 12px; }
    #dialogue.red { background: #301010ee; border-color: #d89090; }
    #dialogue .name { font-weight: 700; margin-bottom: 4px; }
    #dialogue .lines { min-height: 3.9em; white-space: pre-wrap; }
    #dialogue .choices { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    #dialogue button { text-align: left; background: #00000055; color: inherit; border: 1px solid #ffffff44; border-radius: 4px; padding: 5px 8px; font: inherit; }
    #dialogue .hint { opacity: .6; font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game" width="640" height="480"></canvas></div>
  <div id="hud"></div>
  <div id="status"></div>
  <div id="dialogue"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
